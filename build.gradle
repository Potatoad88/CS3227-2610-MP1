plugins {
    id "application"
    id "org.openjfx.javafxplugin" version "0.1.0"
}

group = "com.whatshouldieat"
version = "1.0.0"

def javafxVersion = "25.0.2"
def releaseTargets = [
        WindowsX64: [classifier: "win", fileName: "WhatShouldIEat-windows-x64.jar"],
        LinuxX64  : [classifier: "linux", fileName: "WhatShouldIEat-linux-x64.jar"],
        MacosX64  : [classifier: "mac", fileName: "WhatShouldIEat-macos-x64.jar"],
        MacosArm64: [classifier: "mac-aarch64", fileName: "WhatShouldIEat-macos-arm64.jar"]
]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = "com.whatshouldieat.ui.WhatShouldIEatApp"
}

javafx {
    version = javafxVersion
    modules = ["javafx.controls"]
}

releaseTargets.each { target, details ->
    configurations.create("release${target}")
}

dependencies {
    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    releaseTargets.each { target, details ->
        ["base", "graphics", "controls"].each { module ->
            add("release${target}", "org.openjfx:javafx-${module}:${javafxVersion}:${details.classifier}") {
                transitive = false
            }
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

releaseTargets.each { target, details ->
    tasks.register("release${target}", Jar) {
        group = "distribution"
        description = "Builds the ${target} executable JAR."
        dependsOn classes
        archiveFileName = details.fileName
        destinationDirectory = layout.projectDirectory.dir("release")
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        manifest {
            attributes "Main-Class": "com.whatshouldieat.ui.Launcher"
        }

        from sourceSets.main.output
        from {
            configurations.getByName("release${target}").collect { zipTree(it) }
        }
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
    }
}

tasks.register("releaseJars") {
    group = "distribution"
    description = "Builds executable JARs for all supported platforms."
    dependsOn releaseTargets.keySet().collect { "release${it}" }
}
